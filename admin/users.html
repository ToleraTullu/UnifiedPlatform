<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UniManage - User Management</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/bootstrap/css/bootstrap.min.css">

</head>
<body>
  <div class="app-container">
    <aside class="sidebar"></aside>
    <main class="main-content">
      <header class="topbar"></header>
      <div class="content-wrapper">
        <div class="grid-layout" style="display: grid; grid-template-columns: 350px 1fr; gap: 2rem;">
          
          <!-- Create/Edit Form -->
          <div class="card">
            <h3>User Profile</h3>
            <p style="color:var(--text-muted); margin-bottom:1.5rem;">Configure system access and roles.</p>
            
            <form id="user-form">
              <input type="hidden" id="edit-mode" value="">
              <div class="form-group">
                <label>Username</label>
                <input name="username" id="u-username" required placeholder="User unique ID" />
              </div>
              <div class="form-group" id="pass-group">
                <label>Password</label>
                <input name="password" id="u-password" type="password" required placeholder="••••••••" />
              </div>
              <div class="form-group">
                <label>Full Name</label>
                <input name="name" id="u-name" placeholder="John Doe" />
              </div>
              <div class="form-group">
                <label>Role / Assignment</label>
                <select name="role" id="u-role">
                  <option value="admin">Global Admin</option>
                  <option value="exchange_user">Exchange Operator</option>
                  <option value="pharmacy_user">Pharmacy Operator</option>
                  <option value="pharmacy_manager">Pharmacy Manager (Full Access)</option>
                  <option value="pharmacy_cashier">Pharmacy Cashier (POS &amp; View Only)</option>
                  <option value="construction_user">Construction Manager</option>
                </select>
              </div>
              <div style="display:flex; gap:10px; margin-top:20px;">
                <button class="btn-primary full-width" type="submit" id="submit-btn">Create User</button>
                <button class="btn-secondary" type="button" id="cancel-btn" style="display:none;">Cancel</button>
              </div>
            </form>
          </div>

          <!-- Users List -->
          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
                <h3 style="margin:0">Active Users</h3>
                <div id="no-access" style="display:none; color:var(--danger); font-size:0.9rem; font-weight:600;">⚠️ Admin Only</div>
            </div>
            
            <div class="table-container">
                <table class="data-table">
                  <thead>
                      <tr>
                          <th>User Details</th>
                          <th>System Role</th>
                          <th style="text-align:right">Actions</th>
                      </tr>
                  </thead>
                  <tbody id="users-body"></tbody>
                </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const layout = new Layout();
      layout.ensureLayoutContainers();
      layout.renderSidebar();
      layout.renderTopbar();

      const user = window.Auth && window.Auth.currentUser;
      if (!user || user.role !== 'admin') {
        document.getElementById('no-access').style.display = 'block';
        document.getElementById('user-form').style.display = 'none';
        return;
      }

      const tbody = document.getElementById('users-body');
      const form = document.getElementById('user-form');
      const cancelBtn = document.getElementById('cancel-btn');
      const submitBtn = document.getElementById('submit-btn');
      const editMode = document.getElementById('edit-mode');

      const roleLabels = {
        'admin': 'Global Admin',
        'exchange_user': 'Exchange Operator',
        'pharmacy_user': 'Pharmacy Operator',
        'pharmacy_manager': 'Pharmacy Manager',
        'pharmacy_cashier': 'Pharmacy Cashier',
        'construction_user': 'Construction Manager'
      };

      async function render() {
        tbody.innerHTML = '<tr><td colspan="3" class="empty-state">Loading...</td></tr>';
        const users = await window.Store.get('unified_users') || [];
        tbody.innerHTML = '';
        if (!users.length) {
          tbody.innerHTML = '<tr><td colspan="3" class="empty-state">No users found.</td></tr>';
          return;
        }
        users.forEach(u => {
          const tr = document.createElement('tr');
          const label = roleLabels[u.role] || u.role.replace(/_/g, ' ');
          tr.innerHTML = `
            <td>
                <div style="font-weight:600">${u.name || u.username}</div>
                <div style="font-size:0.8rem; color:var(--text-muted)">@${u.username}</div>
            </td>
            <td>
                <span class="role-badge" style="background:rgba(255,215,0,0.2); color:var(--text-main); border:1px solid var(--primary);">${label}</span>
            </td>
            <td style="text-align:right">
                <button class="btn-secondary edit-user" data-id="${u.id}" data-user="${u.username}" data-name="${u.name||''}" data-role="${u.role}" style="padding:5px 10px; font-size:0.8rem;">Edit</button>
                <button class="btn-danger delete-user" data-id="${u.id}" data-user="${u.username}" style="padding:5px 10px; font-size:0.8rem;">Delete</button>
            </td>`;
          tbody.appendChild(tr);
        });
      }

      await render();

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(form);
        const uname = fd.get('username').trim();
        const role = fd.get('role');
        const name = fd.get('name') || '';
        const password = fd.get('password');

        submitBtn.disabled = true;
        submitBtn.textContent = 'Saving...';

        try {
          if (editMode.value) {
            const payload = { id: editMode.value, name, role };
            if (password) payload.password = password;
            const res = await fetch('../api/users.php?action=update', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            const result = await res.json();
            if (!result.success) throw new Error(result.message || 'Update failed');
          } else {
            if (!password) { alert('Password is required'); return; }
            await window.Store.add('unified_users', { username: uname, password, name, role });
          }
          resetForm();
          await render();
        } catch (err) {
          alert('Error: ' + err.message);
        } finally {
          submitBtn.disabled = false;
        }
      });

      tbody.addEventListener('click', async (ev) => {
        const btn = ev.target.closest('button');
        if (!btn) return;

        if (btn.classList.contains('delete-user')) {
          const uname = btn.dataset.user;
          const uid = btn.dataset.id;
          if (!confirm('Delete user @' + uname + '?')) return;
          await window.Store.remove('unified_users', uid);
          await render();
        } else if (btn.classList.contains('edit-user')) {
          editMode.value = btn.dataset.id;
          document.getElementById('u-username').value = btn.dataset.user;
          document.getElementById('u-username').disabled = true;
          document.getElementById('u-name').value = btn.dataset.name || '';
          document.getElementById('u-role').value = btn.dataset.role;
          document.getElementById('u-password').required = false;
          document.getElementById('u-password').placeholder = '(Leave blank to keep same)';
          submitBtn.textContent = 'Update User';
          cancelBtn.style.display = 'block';
        }
      });

      cancelBtn.onclick = resetForm;

      function resetForm() {
        form.reset();
        editMode.value = '';
        document.getElementById('u-username').disabled = false;
        document.getElementById('u-password').required = true;
        document.getElementById('u-password').placeholder = '••••••••';
        submitBtn.textContent = 'Create User';
        submitBtn.disabled = false;
        cancelBtn.style.display = 'none';
      }
    });
  </script>
</body>
</html>
