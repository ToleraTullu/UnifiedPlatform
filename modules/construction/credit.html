<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Construction - Credit Management</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar"></aside>
        <main class="main-content">
            <header class="topbar"></header>
            <div class="content-wrapper">
                <div class="page-header">
                    <h2>Construction Credit Management</h2>
                    <p>Manage outstanding expenses and income</p>
                </div>

                <div class="card">
                    <h3>Outstanding Credit Transactions</h3>
                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Type</th>
                                    <th>Project</th>
                                    <th>Description</th>
                                    <th>Amount</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="credit-list">
                                <tr><td colspan="6" class="empty-state">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Payment Modal -->
    <div id="payment-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h3 id="modal-title">Settle Transaction</h3>
            <div id="modal-body">
                <form id="settle-payment-form">
                    <input type="hidden" name="id" id="settle-id">
                    <input type="hidden" name="type" id="settle-type">
                    <p>Settling amount: <strong id="settle-amount"></strong></p>
                    
                    <div class="form-group">
                        <label>Payment Method</label>
                        <select name="payment_method" id="settle-method" class="form-control" required>
                            <option value="cash">Cash</option>
                            <option value="bank">Bank Transfer</option>
                        </select>
                    </div>

                    <div class="form-group hidden" id="settle-bank-group">
                        <label>Select Bank Account</label>
                        <select name="bank_account_id" id="settle-bank-id" class="form-control">
                            <!-- Options -->
                        </select>
                    </div>

                    <button type="submit" class="btn-success full-width">Confirm Payment</button>
                </form>
            </div>
        </div>
    </div>

    <script src="../../assets/js/store.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/layout.js"></script>
    <script src="../../js/construction.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
             // Init Layout
             const layout = new Layout();
             layout.ensureLayoutContainers();
             layout.renderSidebar();
             layout.renderTopbar();

             if(window.ConstructionModule && window.ConstructionModule.initCreditPage) {
                 window.ConstructionModule.initCreditPage();
             }
        });
    </script>
</body>
</html>
