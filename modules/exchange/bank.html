<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UniManage - Exchange Banking</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar"></aside>
        <main class="main-content">
            <header class="topbar"></header>
            <div class="content-wrapper">
                <div class="grid-layout" style="display:grid; grid-template-columns: 1fr 400px; gap:2rem;">
                    
                    <!-- Accounts List -->
                    <div class="card">
                        <h3>Exchange Bank Accounts</h3>
                        <p style="color:var(--text-muted); margin-bottom:1.5rem;">Bank accounts assigned to the Exchange sector.</p>
                        
                        <div class="table-container">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>Account Info</th>
                                        <th>Holder</th>
                                        <th>Balance</th>
                                        <th style="text-align:right">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="banks-body">
                                    <tr><td colspan="4" class="empty-state">Loading accounts...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Transfer Tool -->
                    <div class="card">
                        <h3>Internal Transfer</h3>
                        <p style="color:var(--text-muted); margin-bottom:1.5rem;">Move funds between exchange-accessible accounts.</p>
                        
                        <form id="transfer-form">
                            <div class="form-group">
                                <label>From Account</label>
                                <select id="transfer-from" name="from_account_id" class="form-control" required></select>
                            </div>
                            <div class="form-group">
                                <label>To Account</label>
                                <select id="transfer-to" name="to_account_id" class="form-control" required></select>
                            </div>
                            <div class="form-group">
                                <label>Amount</label>
                                <input type="number" step="0.01" name="amount" class="form-control" placeholder="0.00" required />
                            </div>
                            <button type="submit" class="btn-primary full-width" style="margin-top:10px;">Complete Transfer</button>
                        </form>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <script src="../../assets/js/store.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/layout.js"></script>
    <script src="../../assets/js/banking.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const layout = new Layout();
            layout.ensureLayoutContainers();
            layout.renderSidebar();
            layout.renderTopbar();

            const exchangeBanking = new BankingModule('exchange');
            exchangeBanking.init();
        });
    </script>
</body>
</html>
