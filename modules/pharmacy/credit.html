<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pharmacy - Credit Management</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar"></aside>
        <main class="main-content">
            <header class="topbar"></header>
            <div class="content-wrapper">
                <div class="page-header">
                    <h2>Pharmacy Credit Management</h2>
                    <p>Manage and settle outstanding credit sales</p>
                </div>

                <div class="card">
                    <h3>Outstanding Credit Sales</h3>
                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Patient</th>
                                    <th>Doctor</th>
                                    <th>Amount</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="credit-sales-list">
                                <tr><td colspan="6" class="empty-state">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Payment Modal -->
    <div id="payment-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h3 id="modal-title">Settle Payment</h3>
            <div id="modal-body">
                <form id="settle-payment-form">
                    <input type="hidden" name="sale_id" id="settle-sale-id">
                    <p>Settling amount: <strong id="settle-amount"></strong></p>
                    
                    <div class="form-group">
                        <label>Payment Method</label>
                        <select name="payment_method" id="settle-method" class="form-control" required>
                            <option value="cash">Cash</option>
                            <option value="bank">Bank Transfer</option>
                        </select>
                    </div>

                    <div class="form-group hidden" id="settle-bank-group">
                        <label>Select Bank Account</label>
                        <select name="bank_account_id" id="settle-bank-id" class="form-control">
                            <!-- Options -->
                        </select>
                    </div>

                    <button type="submit" class="btn-success full-width">Confirm Payment</button>
                </form>
            </div>
        </div>
    </div>

    <script src="../../assets/js/store.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/layout.js"></script>
    <script>
        // Redirect pharmacy_cashier away from restricted pages
        (function() {
            const u = JSON.parse(sessionStorage.getItem('active_user') || '{}');
            if (u.role === 'pharmacy_cashier') { window.location.href = 'pos.html'; }
        })();
    </script>
    <script src="../../js/pharmacy.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
             // Init Layout
             const layout = new Layout();
             layout.ensureLayoutContainers();
             layout.renderSidebar();
             layout.renderTopbar();

             // Init Pharmacy Module credit logic
             if(window.PharmacyModule && window.PharmacyModule.initCreditPage) {
                 window.PharmacyModule.initCreditPage();
             }
        });
    </script>
</body>
</html>
